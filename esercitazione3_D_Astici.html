<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserimento Auto</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;

        td:nth-child(1) {
            background-color: lightblue;
            text-align: left;
            vertical-align: top;

<body>

    <h3 align="center">--------------Inserimento Auto--------------</h3>
    
    <form method="GET" action="visualizza_es3_D_Astici.php">
        <table>

            <tr>

                <td>Stato</td>

                    <input type="radio" id="stato" name="stato" value="Nuova">

                    <input type="radio" id="stato" name="stato" value="Usata">
                    <label for="usata">Usata</label>
                </td>
            </tr>
            <tr>
                <td>Anno Costruzione</td>

                    <select id="anno-auto" name="anno">

                        <option value="2015">2015</option>

                        <option value="2013">2013</option>
                        <option value="2012">2012</option>
                        <option value="2011">2011</option>
                        <option value="2010">2010</option>
                        <option value="2009">2009</option>
                        <option value="2008">2008</option>
                        <option value="2007">2007</option>
                        <option value="2006">2006</option>
                        <option value="2005">2005</option>
                        <option value="2004">2004</option>
                        <option value="2003">2003</option>
                        <option value="2002">2002</option>
                        <option value="2001">2001</option>
                        <option value="2000">2000</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Cilindrata</td>
                <td><input type="text" name="cc" id="cc"></td>
            </tr>
            <tr>
                <td>Cavalli</td>
                <td><input type="text" name="cv" id="cv"></td>
            </tr>
            <tr>
                <td>Prezzo</td>
                <td><input type="text" name="prz" id="prz"> Euro</td>
            </tr>
            <tr>
                <td>Targa</td>
                <td><input type="text" name="targa" id="targa"></td>
            </tr>
            <tr>
                <td>Accessori</td>
                <td>
                    <input type="checkbox" name="o1" id="o1"> Aria Condizionata <br>
                    <input type="checkbox" name="o2" id="o2"> Vernice Metallizzata <br>
                    <input type="checkbox" name="o3" id="o3"> Tetto in Cristallo <br>
                    <input type="checkbox" name="o4" id="o4"> Impianto Radio-CD <br>
                </td>
            </tr>
            <tr>
                <td>Descrizione Aggiuntiva</td>
                <td><textarea name="descrizione" id="descrizione" rows="6" cols="50"></textarea></td>
            </tr>
        </table>
        
        <input type="submit" value="Invia">
        <input type="reset" value="Cancella">
    </form>

</body>
</html>
